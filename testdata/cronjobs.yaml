apiVersion: v1
kind: List
items:
  - apiVersion: batch/v1
    kind: CronJob
    metadata:
      name: ledger
      namespace: finance
      labels: {team: ledger}
      creationTimestamp: "2026-11-01T00:00:00Z"
    spec:
      schedule: "7 * * * *"
      timeZone: UTC
      concurrencyPolicy: Forbid
      startingDeadlineSeconds: 90
    status:
      lastScheduleTime: "2026-11-05T08:07:00Z"
      lastSuccessfulTime: "2026-11-05T08:08:30Z"
      active: [{apiVersion: batch/v1, kind: Job, name: ledger-example, uid: observed-reference}]
  - apiVersion: batch/v1
    kind: CronJob
    metadata:
      name: prune
      namespace: maintenance
    spec:
      schedule: "0 4 * * SUN"
      timeZone: Europe/Berlin
      suspend: true
      successfulJobsHistoryLimit: 2
      failedJobsHistoryLimit: 0
  - apiVersion: batch/v1
    kind: CronJob
    metadata:
      name: pulse
      namespace: telemetry
    spec:
      schedule: "*/10 * * * *"
  - apiVersion: batch/v1
    kind: CronJob
    metadata:
      name: invalid-window
      namespace: maintenance
    spec:
      schedule: "0 0 31 2 *"
      timeZone: UTC
