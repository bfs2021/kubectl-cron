version: 2
project_name: kubectl-cron

before:
  hooks:
    - go mod download

builds:
  - id: kubectl-cron
    main: .
    binary: kubectl-cron
    env: [CGO_ENABLED=0]
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ignore:
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w -X main.version={{ .Version }}

archives:
  - ids: [kubectl-cron]
    name_template: "{{ .ProjectName }}_{{ .Tag }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    files: [LICENSE]

checksum:
  name_template: checksums.txt

release:
  prerelease: auto

snapshot:
  version_template: "{{ .Tag }}-next"

changelog:
  sort: asc
  filters:
    exclude: ['^docs:', '^test:', '^chore:']
